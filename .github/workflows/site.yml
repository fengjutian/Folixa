name: site-build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: 项目静态站点
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 安装依赖
        run: npm ci

      # 类型与模板检查：astro check 会把 .astro 里的类型错误挡在构建之前
      - name: 站点检查
        run: npm run check

      - name: 构建站点
        run: npm run build

      # 产物落在 site-dist/，与 C++ 打包目录 dist/ 物理隔离
      - name: 上传站点产物
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: site-dist/
          if-no-files-found: error
