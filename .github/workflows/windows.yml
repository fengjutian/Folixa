name: windows-build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Windows x64 / Debug + Release
    runs-on: windows-2022
    timeout-minutes: 45

    env:
      AIPDF_QT_ROOT: 'C:\Qt\6.8.3\mingw_64'
      AIPDF_MINGW_ROOT: 'C:\Qt\Tools\mingw1310_64'

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 与本地完全相同的流水线：工具链 → Debug/Release 构建与测试 → 启动验收
      # → 打包 → 无 SDK 打包验收 → 版本一致性。
      - name: 运行完整流水线
        shell: pwsh
        run: ./scripts/ci.ps1

      - name: 上传安装包与验收证据
        uses: actions/upload-artifact@v4
        with:
          name: ai-pdf-editor-win64
          path: |
            dist/*.zip
            dist/*.zip.sha256
            build/acceptance/
          if-no-files-found: error
